tooltip:
  en_us: >-
    Prototype: reports summary-only host-model steel PSF. Structural framing and
    columns use usable length times nominal section weight; PSF uses summed
    computed Floor area by level. Includes optional raw and summary CSV export
    files and an Excel workbook when Microsoft Excel is available.
