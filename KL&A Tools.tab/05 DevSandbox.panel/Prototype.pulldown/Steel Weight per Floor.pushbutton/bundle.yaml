title:
  en_us: "Steel Weight\nper Floor"
tooltip:
  en_us: >-
    Prototype: reports host-model steel structural framing and columns by level.
    Weight is material volume times structural-asset density; PSF uses the
    summed computed area of Floors at each level. Roof framing, sloped columns,
    and multi-level columns are included; columns are assigned to Base Level.
engine:
  clean: true
