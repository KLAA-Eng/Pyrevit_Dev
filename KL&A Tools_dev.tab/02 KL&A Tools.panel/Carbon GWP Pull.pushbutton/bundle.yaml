tooltip:
  en_us: |
    Version: v1.1
    Date: 10.22.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:

    Export three material schedules to Excel, refresh and save the selected
    post-processing workbook, read its GWP and material-volume values, and
    create or update charts on the active
    SYNC TO CENTRAL sheet. Requires Microsoft Excel on this workstation.
    _____________________________________________________________________
    How-to:

    -> Open the SYNC TO CENTRAL sheet and click the button.
    -> Select three schedules, an export workbook, and a different
       post-processing workbook. The latter will be refreshed and saved.
    -> Review the pyRevit output report and any Material Accuracy warning.
    _____________________________________________________________________
    Last update:

    - [10.22.2026] v1.1 - Planned Excel compatibility and post-processing workbook persistence correction.

