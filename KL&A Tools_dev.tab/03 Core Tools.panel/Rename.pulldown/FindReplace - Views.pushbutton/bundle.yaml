title:
  en_us: Find and Replace in Views
author: KL&A
tooltip:
  en_us: |-
    Version: v1.0
    Date: 10.09.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:

    Rename selected views with case-sensitive Find/Replace, Prefix, Suffix,
    Uppercase, or Lowercase. Exact conflicts are skipped and shown in the dialog.
    _____________________________________________________________________
    How-to:

    -> Select views in the Project Browser, or choose from an unchecked list.
    -> Enter Find, Replace, Prefix, or Suffix values and click Rename, or use a case button.
    -> A complete action closes quietly; review skipped or failed views in the dialog.
    _____________________________________________________________________
    Last update:
    - [10.09.2026] - v1.0 (Unreleased): Add Uppercase and Lowercase actions, an unchecked view list without IDs, exact-conflict handling, and in-dialog results.
