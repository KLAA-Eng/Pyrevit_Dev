title:
  fr_fr: Illustrer Profondeur de Vue
  en_us: Show View Range
  de_de: Ansichtsbereich anzeigen
  ru: Секущий диапазон
tooltip:
  fr_fr: Outil pour illustrer la profondeur de vue des vues en plan dans une vue 3D à l'aide de plans colorés. Ouvrir une vue 3D et sélectionner les vues en plan à illustrer dans le navigateur de projet.
  en_us: |-
    Version: v1.1
    Date: 10.09.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:

    Show a selected plan or section view's range in a 3D view using colored planes.
    For editable plan views, review and change level offsets and associated levels.
    _____________________________________________________________________
    How-to:

    -> Open a 3D view, run the tool, and select a plan or section view in the Project Browser.
    -> Review the four plane elevations. For an editable plan view, adjust offsets or levels and apply changes.
    _____________________________________________________________________
    Last update:
    - [10.09.2026] v1.1 - Refined the View Range editor's headings, text size, column alignment, message space, and vertical spacing.
  de_de: >-
    Zunächst öffnet man eine 3D Ansicht, in der der Ansichtsbereich 
    eines Grundrisses farblich temporär mit Flächen dargestellt 
    werden soll. Nachdem man das Skript gestartet hat, muss man im 
    Projektbrowser eine Ansicht auswählen (z.B. einen Grundriss). 
    Die Oberkante (Top Plane), die Schnittebene (Cut Plane), 
    die Unterkane (Bottom Plane) und die Ebene der Ansichtstiefe 
    (View Depth) werden nun grafisch in der 3D Ansicht als 
    Fläche eingeblendet. Zudem werden im Dialog die Höhen angezeigt.
  ru: >-
    Откройте 3D-вид, в котором границы области вида плана будут временно показаны цветными поверхностями.

    После запуска скрипта необходимо выбрать в диспетчере проекта вид (например, план этажа).

    В 3D-виде будут графически отображены: верхняя граница (Top Plane), секущая плоскость (Cut Plane), нижняя граница (Bottom Plane) и плоскость глубины вида (View Depth).

    Кроме того, в диалоге будут показаны их отметки (высоты).
