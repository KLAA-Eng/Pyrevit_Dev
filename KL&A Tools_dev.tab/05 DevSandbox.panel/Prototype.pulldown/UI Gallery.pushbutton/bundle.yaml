tooltip:
  en_us: |-
    Version: v0.5
    Date: 10.27.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: reviews standalone windows by origin, calling tools, and interactive sample state. Custom previews reuse repository XAML. Native picker selections are discarded; compiled previews remain deferred.
    _____________________________________________________________________
    How-to:
    - Search by window or tool name, or filter the origin.
    - Select a row to see the calling tools and preview availability.
    - Choose a supported preview state and Open preview. All tool actions are simulated.
    - Review KLCode main template for the shared custom-window foundation.
    _____________________________________________________________________
    Last update:
    - [10.27.2026] - v0.5 (Unreleased): Add origins, source paths, tool callers, interactive states, faithful Recall, standalone coverage, and the shared main-template reference.
