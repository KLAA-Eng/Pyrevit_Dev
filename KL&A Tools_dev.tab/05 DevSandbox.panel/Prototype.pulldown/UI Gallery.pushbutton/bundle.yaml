title:
  en_us: "UI Gallery"
tooltip:
  en_us: |-
    Version: v0.5
    Date: 10.30.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: reviews standalone windows by origin, calling tools, and interactive sample state. Custom previews reuse repository XAML. Native picker selections are discarded; compiled previews remain deferred.
    _____________________________________________________________________
    How-to:
    - Search by window or tool name, or filter Origin and Preview availability.
    - Select a row to see the calling tools and preview availability.
    - Choose a supported variant and preview state, then Open preview. All tool actions are simulated.
    - Search Template - to review the Options and Review references.
    - Select Shared dialog - Message and choose Warning or Success to preview those message severities.
    - Search Shared dialog to review shared families, including Selection presets and KLC-Rename variants.
    _____________________________________________________________________
    Last update:
    - [10.30.2026] - v0.5 (Unreleased): Standalone inventory with origins, callers and interactive states; shared dialog families with variants, including Action choice, Command Switch and KLC-Rename; Options and Review references.
author: KL&A
