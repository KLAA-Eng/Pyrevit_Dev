title:
  en_us: "Check Hanger\nLocations"
tooltip:
  en_us: |-
    Version: v0.0
    Date: 10.27.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: uses each Hangers_Clever_KLAA hanger's text orientation to find the supported member (along the top or base of the text) and the supporting member (across the text, skew allowed), checks the hanger's Header and Joist sizes against them, colors them in the active view, and reports Designation/Header/Joist, member types, location match, and size mismatch. Port of the Check Hanger Locations Dynamo graph.
    _____________________________________________________________________
    How-to:
    - Select nothing to report every hanger in the active view, or select hangers to zoom to them and report only those.
    - Review colors: supported blue, supporting yellow, both green, problem hanger halftone red.
    - Re-run after fixing framing to clear resolved highlights. Hanger Highlights turns the colors on or off.
    _____________________________________________________________________
    Last update:
    - [10.27.2026] - v0.0 (Unreleased): First DevSandbox port of the Check Hanger Locations Dynamo graph.
author: KL&A
engine:
