title:
  en_us: "Section\nDetailer"
tooltip:
  en_us: |-
    Version: v0.0
    Date: 10.30.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: places KL&A steel and wood detail components over framing and columns in the active section view: Section components on members cut or beyond, Side components on members along the section, and one component per ply for built-up wood. Missing types load from the KLAA detail component library. Revit 2023+; adds detail components to the active view.
    _____________________________________________________________________
    How-to:
    - Open a section view and click the button.
    - Approve loading any missing types; pick a family when more than one matches.
    - Re-running offers to replace or add to components this tool placed earlier.
    - Oblique or curved members and unsupported shapes are listed, not placed.
    _____________________________________________________________________
    Last update:
    - [10.30.2026] - v0.0: Prototype for steel and wood members cut, beyond, and along the section.
author: KL&A
min_revit_version: 2023
engine:
  clean: true
