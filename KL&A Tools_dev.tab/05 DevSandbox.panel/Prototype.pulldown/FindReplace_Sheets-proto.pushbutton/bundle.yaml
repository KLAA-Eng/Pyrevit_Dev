title:
  en_us: "Find and Replace in Sheets"
tooltip:
  en_us: |-
    Version: v0.1
    Date: 10.08.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: renames selected sheet names and numbers with Find, Replace, Prefix, and Suffix fields, or converts titles with direct UPPERCASE and lowercase buttons. Conflicting exact targets are skipped and reported.
    _____________________________________________________________________
    How-to:
    - Select sheets in the Project Browser, or choose them when prompted.
    - Set the sheet-name and sheet-number criteria and click Rename, or use a case button for titles only.
    - A complete result closes quietly. Review skipped or failed sheets in the expanded dialog.
    _____________________________________________________________________
    Last update:
    - [10.08.2026] - v0.1 (Unreleased): Exact-value sheet renaming, per-sheet rollback, guarded batch outcomes, and in-dialog results.
author: KL&A
