title:
  en_us: "Excel COM Smoke Test"
tooltip:
  en_us: |-
    Version: v0.2
    Date: 10.14.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: tests the shared Excel COM facade in the current Revit/pyRevit host using owned temporary workbook and CSV files. After a failed name lookup, tries an identity-checked Office 16 interop DLL by path, then probes direct Excel activation and cleanup.
    _____________________________________________________________________
    How-to:
    - Run with Microsoft Excel installed.
    - Use a fresh Revit session for the explicit Office DLL load trial; close Revit after reviewing the result.
    - Review the operation table; inspect retained temporary files if a test or safe cleanup fails.
    _____________________________________________________________________
    Last update:
    - [10.14.2026] - v0.2 (Unreleased): Show script identity and assembly diagnostics; after failed name lookup, try a verified local Office 16 interop DLL by path and direct Excel activation.
    - [10.13.2026] - v0.1 (0.0.12): Added Excel interop assembly lookup and loaded-file diagnostics.
    - [10.05.2026] - v0.0 (0.0.10): First main delivery of a disposable Excel facade lifecycle and operation smoke test.
author: KL&A
engine:
