title:
  en_us: "Create View\nDetail Folders"
tooltip:
  en_us: |-
    Version: v0.0
    Date: 08.17.2026
    _____________________________________________________________________
    Description:
    Prototype: creates a folder for each matching Detail or Drafting view, with an 8.5x11 PDF, 2400-pixel JPEG preview, and static HTML page. Existing output is preserved. Revit 2022+.
    _____________________________________________________________________
    How-to:
    - Select Detail and Drafting view types.
    - Choose an existing destination folder and review the export results.
    _____________________________________________________________________
    Last update:
    - [08.17.2026] - v0.0 (0.0.4.beta): First main delivery of per-view PDF/JPEG/HTML packages, including export/API corrections developed before delivery.
