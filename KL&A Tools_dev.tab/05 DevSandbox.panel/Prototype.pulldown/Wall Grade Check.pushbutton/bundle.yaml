title:
  en_us: "Wall Grade Check"
tooltip:
  en_us: |-
    Version: v0.0
    Date: 11.12.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: draws finished grade along the outside face of foundation walls for engineering review, and flags runs where grade is closer than a set clearance (default 8") to the top of wall, or at or above it. Grade comes from Revit topography (Toposolids or Topography, including linked models) or from the spot elevation and contour labels of a PDF grading plan aligned with PDF Overlay. Adds model lines on the exterior of the walls and text notes in KLA Grade Review styles, and ghosts the topography (see-through, halftone) in the 3D view you are in; Clear review lines removes them and restores the view.
    _____________________________________________________________________
    How-to:
    - Select the walls to check, or select nothing to check the Foundation and Retaining walls in the active view. A locked 3D view, section, or plan shows the flag notes.
    - Run the command and choose Grade from Revit topography or Grade from PDF grading plan.
    - Enter the clearance in inches (8 by default; 6 for IRC work).
    - PDF only: first import and align the grading plan with PDF Overlay in a plan view, then pick it, pick a reference level (T/SLAB or Level 1), and enter that level's USGS elevation (5432.50 or 5432'-6") so the PDF's USGS grades land at the right height. The last value is remembered per model.
    - Blue lines are grade with enough clearance, orange is closer than the clearance, red is at or above the top of wall. Flagged walls are selected and listed in the report window.
    - Run from the 3D view you want to review: its topography is ghosted in temporarily (hidden topography is shown again) so the grade lines on the walls read through it. With a PDF, a see-through grade strip is also drawn 4 ft out from each wall.
    - Run again and choose Clear review lines to delete all review lines, notes, and strips and restore the topography in that view. Undo also works.
    _____________________________________________________________________
    Last update:
    - [11.12.2026] - v0.0 (Unreleased): First DevSandbox grade-along-wall review from Revit topography or a PDF grading plan, with clearance and over-top flags.
author: KL&A
min_revit_version: 2023
