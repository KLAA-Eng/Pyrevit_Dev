title:
  en_us: "Check Section\nReferences"
tooltip:
  en_us: |-
    Version: v0.0
    Date: 10.28.2026
    Status: Unreleased
    _____________________________________________________________________
    Description:
    Prototype: for every reference section in the active plan view (a section set to reference another view), compares the modeled walls, floors, framing, columns, foundations, and roofs cut at the marker with the detail it references, and reports an approximate match percentage as a review guide. A live referenced section is compared element by element (type, size, material, orientation to the cut, and side); a referenced drafting view is compared with its detail component names, filled region types, and notes. SIM and OH text next to a marker is read: SIM accepts size and type differences, OH mirrors the reference. Nothing in the model changes.
    _____________________________________________________________________
    How-to:
    - Open the plan view that shows the section markers and run the command.
    - Review the lowest matches first; the percentage is a guide, not a pass/fail.
    - Click a marker Id to select it, then Zoom to selection to zoom to it.
    _____________________________________________________________________
    Last update:
    - [10.28.2026] - v0.0 (Unreleased): First DevSandbox section reference check with SIM/OH notes.
author: KL&A
