title: Model Checker
author: KL&A
tooltip: |
  Version: v0.0
  Date: 10.16.2026
  Status: Unreleased
  _____________________________________________________________________
  Description:

  Review whole-model steel geometry before SDS2 export: beam endpoints,
  connection roles, vertical alignment, column grids/faces, duplicates,
  interior crossings, and floor/roof bottom-face work planes.
  Creates a colored 3D review view; member geometry is unchanged.
  Unsupported geometry is reported as Not evaluated.
  _____________________________________________________________________
  How-to:

  -> Confirm export phase, design options, enabled checks, and inch tolerances.
  -> Review findings, select/zoom to members, and record intentional exceptions.
  -> Correct the model manually and rerun. Linked models are excluded.
  _____________________________________________________________________
  Last update:
  - [10.16.2026] v0.0 - Avoid review-view name collisions with numbered suffixes.
  - [10.16.2026] v0.0 - Set review views to 1/4 inch = 1 foot; apply only surface-pattern colors.
  - [10.16.2026] v0.0 - Add an isolated 3D review view with live report-filter colors and a modeless report.
  - [10.16.2026] v0.0 - Require full-depth column-shaft containment; report column-top bearing separately.
  - [10.16.2026] v0.0 - Classify beam joints; add linked records, underside work planes, and crossing errors.
  - [10.16.2026] v0.0 - Add ribbon icons and clearer finding labels, search, and measurements.
  - [10.16.2026] v0.0 - Added whole-model steel checks under Model Review.
  - [10.16.2026] v0.0 - Show failure stage and full traceback in dialog details.
  - [10.16.2026] v0.0 - Fix IronPython name access when opening the phase selector.
engine:
  clean: true
  full_frame: false
  persistent: true
